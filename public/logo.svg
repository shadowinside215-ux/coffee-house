<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radial luxury gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E130D" />
      <stop offset="70%" stop-color="#0E0906" />
      <stop offset="100%" stop-color="#060403" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFEBB3" stop-opacity="1" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Medallion -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8" />

  <!-- Steam Trails -->
  <g filter="url(#neonGlow)">
    <path d="M232 152 C228 135 238 122 232 106 C228 94 236 84 232 72" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <path d="M256 148 C252 128 264 114 256 94 C250 80 260 68 256 54" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M280 152 C284 135 274 122 280 106 C284 94 276 84 280 72" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Artisan Coffee Cup -->
  <g>
    <!-- Cup Body -->
    <path d="M184 168 H328 V212 C328 252 296 276 256 276 C216 276 184 252 184 212 Z" fill="#140E0A" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Cup Handle -->
    <path d="M328 182 C348 182 362 194 362 212 C362 230 348 242 328 242" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Cup Saucer -->
    <path d="M164 286 C210 292 302 292 348 286" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Coffee Bean Emblem on Cup -->
    <ellipse cx="256" cy="216" rx="16" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="3" transform="rotate(-15 256 216)" />
    <path d="M256 195 C262 208 250 224 256 237" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" transform="rotate(-15 256 216)" />
  </g>

  <!-- Arabic Typography: دار القهوة -->
  <!-- Rendered with styled Arabic curves and fallback text for universal SVG renderers -->
  <text x="256" y="356" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Cairo', serif" font-weight="700" font-size="58" fill="url(#glowGold)" letter-spacing="2" filter="url(#neonGlow)">دار القهوة</text>

  <!-- Decorative Separator Ribbons -->
  <g filter="url(#neonGlow)">
    <line x1="100" y1="384" x2="200" y2="384" stroke="url(#goldGrad)" stroke-width="1.8" />
    <polygon points="256,380 260,384 256,388 252,384" fill="url(#goldGrad)" />
    <circle cx="218" cy="384" r="2.5" fill="#FFEBB3" />
    <circle cx="294" cy="384" r="2.5" fill="#FFEBB3" />
    <line x1="312" y1="384" x2="412" y2="384" stroke="url(#goldGrad)" stroke-width="1.8" />
  </g>

  <!-- English Subtitle: THE COFFEE HOUSE -->
  <text x="256" y="420" text-anchor="middle" font-family="'Playfair Display', 'Plus Jakarta Sans', Georgia, serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="7" filter="url(#neonGlow)">THE COFFEE HOUSE</text>

  <!-- Location Tag: SALA AL JADIDA -->
  <text x="256" y="448" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" fill="#C5A059" letter-spacing="5">SALA AL JADIDA · 11100</text>
</svg>
